const Storage = {
  async get(key, shared) {
    if (window.storage && window.storage.get) return window.storage.get(key, shared);
    const raw = localStorage.getItem("thakher_" + key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw, shared };
  },
  async set(key, value, shared) {
    if (window.storage && window.storage.set) return window.storage.set(key, value, shared);
    localStorage.setItem("thakher_" + key, value);
    return { key, value, shared };
  },
};

function DonutChart({ data, centerLabel, centerSub, size = 150, strokeWidth = 20 }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  let offsetAcc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="#EFF5EC" strokeWidth={strokeWidth} />
      <g transform={`rotate(-90 ${size / 2} ${size / 2})`}>
        {data.filter((d) => d.value > 0).map((d, i) => {
          const frac = d.value / total;
          const dash = frac * circumference;
          const gap = circumference - dash;
          const el = (
            <circle key={i} cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={d.color} strokeWidth={strokeWidth} strokeDasharray={`${dash} ${gap}`} strokeDashoffset={-offsetAcc} strokeLinecap="butt" />
          );
          offsetAcc += dash;
          return el;
        })}
      </g>
      <text x="50%" y="47%" textAnchor="middle" fontSize="22" fontWeight="700" fill="#1E2E1B" fontFamily="'Cairo', sans-serif">{centerLabel}</text>
      <text x="50%" y="62%" textAnchor="middle" fontSize="10" fill="#5F7159">{centerSub}</text>
    </svg>
  );
}


function SimpleLineChart({ data, dataKey, color, height = 190, targetKey, currencyFmt, onPointClick, targetLabel, targetUnitNoun }) {
  const [active, setActive] = useState(null);
  const [activeTarget, setActiveTarget] = useState(null);
  const width = 600;
  const padding = { top: 10, right: 12, bottom: 24, left: 36 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const maxY = Math.max(10, ...data.map((d) => d[dataKey]), ...(targetKey ? data.map((d) => d[targetKey] || 0) : []));
  const stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
  const toXY = (key) => data.map((d, i) => [padding.left + i * stepX, padding.top + innerH - ((d[key] || 0) / maxY) * innerH]);
  const points = toXY(dataKey);
  const targetPoints = targetKey ? toXY(targetKey) : null;
  const pathD = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const targetPathD = targetPoints ? targetPoints.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ") : null;
  const yTicks = [0, 0.5, 1].map((f) => Math.round(maxY * f));
  const activeData = active != null ? data[active] : null;
  const activeRate = active != null ? (active === 0 ? data[0].sold : data[active].sold - data[active - 1].sold) : null;
  const hasTargets = targetKey && data.some((d) => d.targetCumCount > 0);
  const activeTargetData = activeTarget != null ? data[activeTarget] : null;

  const lastIdx = data.length - 1;
  const isOnTrack = targetKey && data[lastIdx] ? data[lastIdx][dataKey] >= (data[lastIdx][targetKey] || 0) : null;
  const lineColor = isOnTrack == null ? color : (isOnTrack ? "#2A4C25" : "#B5502E");

  return (
    <div style={{ position: "relative" }}>
      <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height, display: "block" }}>
        {yTicks.map((t, i) => {
          const y = padding.top + innerH - (t / maxY) * innerH;
          return (
            <g key={i}>
              <line x1={padding.left} y1={y} x2={width - padding.right} y2={y} stroke="#E3ECDF" strokeWidth="1" />
              <text x={padding.left - 6} y={y + 3} textAnchor="end" fontSize="10" fill="#8CA184">{t}%</text>
            </g>
          );
        })}
        {data.map((d, i) => (
          <text key={i} x={padding.left + i * stepX} y={height - 6} textAnchor="middle" fontSize="10" fill="#8CA184">{d.month}</text>
        ))}
        {targetPathD && <path d={targetPathD} fill="none" stroke="#8CA184" strokeWidth="1.5" strokeDasharray="4 4" />}
        {targetPoints && hasTargets && targetPoints.map((p, i) => (
          <g key={`t${i}`} style={{ cursor: "pointer" }} onMouseEnter={() => setActiveTarget(i)} onClick={() => { setActiveTarget(activeTarget === i ? null : i); setActive(null); }}>
            <circle cx={p[0]} cy={p[1]} r="8" fill="transparent" />
            <circle cx={p[0]} cy={p[1]} r={activeTarget === i ? 4 : 2} fill="#FFFFFF" stroke="#8CA184" strokeWidth="1.5" />
          </g>
        ))}
        <path d={pathD} fill="none" stroke={lineColor} strokeWidth="2" />
        {points.map((p, i) => (
          <g key={i} style={{ cursor: "pointer" }} onMouseEnter={() => setActive(i)} onClick={() => { setActive(active === i ? null : i); setActiveTarget(null); if (onPointClick) onPointClick(data[i], i); }}>
            <circle cx={p[0]} cy={p[1]} r="9" fill="transparent" />
            <circle cx={p[0]} cy={p[1]} r={active === i ? 4.5 : 2.5} fill={lineColor} stroke={active === i ? "#1E2E1B" : "none"} strokeWidth="1.5" />
          </g>
        ))}
      </svg>
      {targetKey && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", fontSize: 10.5, color: "#8CA184", marginTop: 2 }}>
          <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
            <span style={{ width: 14, height: 0, borderTop: "1.5px dashed #8CA184" }} /> {targetLabel || "Target"} {hasTargets && "— click a point for that month's goal"}
          </span>
          {isOnTrack != null && (
            <span style={{ display: "flex", alignItems: "center", gap: 4, fontWeight: 700, color: isOnTrack ? "#2A4C25" : "#B5502E" }}>
              <span style={{ width: 6, height: 6, borderRadius: "50%", background: isOnTrack ? "#2A4C25" : "#B5502E" }} />
              {isOnTrack ? "On track" : "Behind pace"}
            </span>
          )}
        </div>
      )}
      {activeTargetData && hasTargets && (
        <div style={{ position: "absolute", top: 4, left: 4, background: "#FFFFFF", border: "1px solid #DCE6D8", borderRadius: 8, padding: "8px 12px", fontSize: 12, boxShadow: "0 4px 12px rgba(0,0,0,0.12)" }}>
          <div style={{ fontWeight: 700, marginBottom: 4 }}>{activeTargetData.month} {targetLabel || "Target"}</div>
          <div style={{ color: "#5F7159" }}>This month: <strong>+{activeTargetData.targetMonthCount}</strong> {targetUnitNoun}</div>
          {currencyFmt && activeTargetData.targetMonthValue > 0 && <div style={{ color: "#C9932A", fontWeight: 700, fontSize: 11.5 }}>≈ {currencyFmt(activeTargetData.targetMonthValue)}</div>}
          <div style={{ color: "#5F7159", marginTop: 5 }}>By {activeTargetData.month}: <strong>{activeTargetData.targetCumCount}</strong> {targetUnitNoun}</div>
          {currencyFmt && activeTargetData.targetCumValue > 0 && <div style={{ color: "#8CA184", fontSize: 11 }}>≈ {currencyFmt(activeTargetData.targetCumValue)} cumulative</div>}
        </div>
      )}
      {activeData && (
        <div style={{ position: "absolute", top: 4, right: 4, background: "#FFFFFF", border: "1px solid #DCE6D8", borderRadius: 8, padding: "8px 12px", fontSize: 12, boxShadow: "0 4px 12px rgba(0,0,0,0.12)" }}>
          <div style={{ fontWeight: 700, marginBottom: 2 }}>{activeData.month}</div>
          <div style={{ color: "#5F7159" }}>{activeData.sold} of {activeData.total} sold ({activeData.pct}%)</div>
          <div style={{ color: "#8CA184", fontSize: 11 }}>{activeRate >= 0 ? "+" : ""}{activeRate} vs previous month</div>
          {currencyFmt && <div style={{ color: "#C9932A", fontSize: 11.5, fontWeight: 700, marginTop: 3 }}>{currencyFmt(activeData.revenue || 0)} sold this month</div>}
          {onPointClick && <div className="tk-edit-btn" style={{ color: "#2A4C25", fontSize: 11, fontWeight: 700, marginTop: 6, textDecoration: "underline" }} onClick={() => onPointClick(activeData, active)}>View unit list ›</div>}
        </div>
      )}
    </div>
  );

function rng(seed) {
  let s = seed;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

function buildUnitsDefault() {
  const rand = rng(7);
  const statuses = ["Available", "Reserved", "Sold"];
  const rows = [];
  let id = 1;
  PROJECTS_DEFAULT.forEach((project, pIdx) => {
    const count = 18;
    for (let i = 0; i < count; i++) {
      const area = Math.round(90 + rand() * 220);
      const pricePerSqm = Math.round(4800 + rand() * 3200);
      const totalPrice = area * pricePerSqm;
      const status = statuses[Math.floor(rand() * statuses.length)];
      const broker = BROKERS[Math.floor(rand() * BROKERS.length)];
      const saleDate = status === "Sold" ? dateOffset(-Math.round(5 + rand() * 200)) : null;
      const amountCollected = status === "Sold" ? Math.round(totalPrice * (0.55 + rand() * 0.45)) : 0;
      const handedOver = status === "Sold" ? rand() > 0.5 : false;
      rows.push({ id: id++, projectId: project.id, unitNo: `U-${pIdx + 1}${String(i + 1).padStart(2, "0")}`, area, pricePerSqm, totalPrice, status, broker, saleDate, amountCollected, handedOver, notes: "" });
    }
  });
  return rows;
}
const UNITS_DEFAULT = buildUnitsDefault();

const sar = (n) => `SAR ${Math.round(n).toLocaleString()}`;
const sarCompact = (n) => {
  const num = Number(n) || 0;
  const abs = Math.abs(num);
  if (abs >= 1000000) return `SAR ${(num / 1000000).toFixed(1).replace(/\.0$/, "")}M`;
  if (abs >= 1000) return `SAR ${(num / 1000).toFixed(1).replace(/\.0$/, "")}K`;
  return `SAR ${Math.round(num).toLocaleString()}`;
};
const pct = (part, total) => (total ? Math.round((part / total) * 100) : 0);

function GaugeKpiCard({ title, needles, maxValue, currencyFmt, big, onClick, clickHint, footer, description }) {
  const size = 220;
  const cx = size / 2, cy = size * 0.56, r = size * 0.42;
  const angleFor = (v) => Math.PI * (1 - Math.max(0, Math.min(1, maxValue ? v / maxValue : 0)));
  const arcStart = { x: cx - r, y: cy };
  const arcEnd = { x: cx + r, y: cy };
  return (
    <div
      onClick={onClick}
      className={onClick ? "tk-clickable-card" : ""}
      style={{ background: "#FFFFFF", border: "1px solid #DCE6D8", borderRadius: 10, padding: big ? "22px 24px" : "16px 18px", flex: 1, minWidth: big ? 260 : 220, cursor: onClick ? "pointer" : "default" }}
    >
      <div style={{ fontSize: big ? 14 : 12, color: "#5F7159", letterSpacing: "0.04em", textTransform: "uppercase", marginBottom: 6, display: "flex", alignItems: "center" }}>{title}{description && <InfoTip text={description} />}</div>
      <svg viewBox={`0 0 ${size} ${size * 0.62}`} style={{ width: "100%", height: "auto", display: "block" }}>
        <path d={`M ${arcStart.x} ${arcStart.y} A ${r} ${r} 0 0 1 ${arcEnd.x} ${arcEnd.y}`} fill="none" stroke="#EFF5EC" strokeWidth="12" strokeLinecap="round" />
        {needles.map((n, i) => {
          const a = angleFor(n.value);
          const x2 = cx + Math.cos(a) * (r - 2);
          const y2 = cy - Math.sin(a) * (r - 2);
          return <line key={i} x1={cx} y1={cy} x2={x2} y2={y2} stroke={n.color} strokeWidth="3" strokeLinecap="round" />;
        })}
        <circle cx={cx} cy={cy} r="5" fill="#1E2E1B" />
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 4 }}>
        {needles.map((n, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: big ? 13 : 11.5 }}>
            <span style={{ display: "flex", alignItems: "center", gap: 6, color: "#5F7159" }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: n.color }} /> {n.label}
            </span>
            <span style={{ fontWeight: 700, fontFamily: "'Cairo', sans-serif", color: "#1E2E1B" }}>
              {currencyFmt ? currencyFmt(n.value) : n.value}
              {n.pct != null && <span style={{ fontWeight: 500, color: "#8CA184", marginLeft: 4 }}>({n.pct}%)</span>}
              {n.secondary && <span style={{ fontWeight: 600, color: "#8CA184", marginLeft: 6 }}>· {n.secondary}</span>}
            </span>
          </div>
        ))}
      </div>
      {footer}
      {onClick && <div style={{ fontSize: 10.5, color: "#8CA184", marginTop: 8 }}>{clickHint || "Click for details ›"}</div>}
    </div>
  );
}

function MasterplanSection({ plots, onUpdatePlot, editMode, statusFilter, setStatusFilter, t, calibrateMode, calibratePlotId, setCalibratePlotId, onRepositionPlot }) {
  const [selected, setSelected] = useState(null);
  const [hovered, setHovered] = useState(null);
  const [zoom, setZoom] = useState(1);
  const [focus, setFocus] = useState({ x: 50, y: 50 });
  const stageRef = useRef(null);

  const handleStageClick = (e) => {
    if (!calibrateMode || !calibratePlotId || !stageRef.current) return;
    const rect = stageRef.current.getBoundingClientRect();
    const x = Math.round(((e.clientX - rect.left) / rect.width) * 1000) / 10;
    const y = Math.round(((e.clientY - rect.top) / rect.height) * 1000) / 10;
    onRepositionPlot(calibratePlotId, x, y);
  };

  const counts = useMemo(() => {
    const c = { "Under Development": 0, Available: 0, Sold: 0, Reserved: 0, Existing: 0 };
    plots.forEach((p) => c[p.status]++);
    return c;
  }, [plots]);

  const toggleStatus = (status) => {
    setStatusFilter((prev) => (prev === status ? "All" : status));
    setSelected(null);
  };

  const focusOn = (p) => {
    setFocus({ x: p.x, y: p.y });
    setZoom((z) => (z < 1.8 ? 2 : z));
  };
  const zoomIn = () => setZoom((z) => Math.min(4, Math.round((z + 0.5) * 10) / 10));
  const zoomOut = () => setZoom((z) => Math.max(1, Math.round((z - 0.5) * 10) / 10));
  const resetView = () => { setZoom(1); setFocus({ x: 50, y: 50 }); };

  const selectedPlot = plots.find((p) => p.id === selected);

  return (
    <div id="masterplan-section" style={{ marginBottom: 28, scrollMarginTop: 20 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
        <MapPin size={16} color="#1E2E1B" />
        <div style={{ fontFamily: "'Cairo', sans-serif", fontSize: 18, fontWeight: 600 }}>{t ? t("interactiveMasterplan") : "Interactive masterplan"}</div>
      </div>
      <p style={{ fontSize: 12.5, color: "#5F7159", margin: "0 0 12px" }}>
        Lower Platform &mdash; click a status below or a marker to cross-filter the whole dashboard{editMode ? ", or edit a plot's details right there" : ""}.
      </p>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        {MAP_STATUS_ORDER.map((s) => {
          const meta = MAP_STATUS_META[s];
          const active = statusFilter === "All" || statusFilter === s;
          return (
            <div key={s} className={`mp-chip${active ? "" : " inactive"}`} onClick={() => toggleStatus(s)} style={{ display: "flex", alignItems: "center", gap: 6, background: statusFilter === s ? `${meta.color}1A` : "#FFFFFF", border: `1px solid ${statusFilter === s ? meta.color : "#DCE6D8"}`, borderRadius: 20, padding: "5px 12px" }}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: meta.color }} />
              <span style={{ fontSize: 12, fontWeight: 500 }}>{meta.label}</span>
              <span style={{ fontSize: 11, color: "#8CA184", fontFamily: "'IBM Plex Mono', monospace" }}>{counts[s]}</span>
            </div>
          );
        })}
      </div>

      {calibrateMode && (
        <div style={{ background: "#FFF8E8", border: "1px solid #C9932A55", borderRadius: 8, padding: "8px 12px", fontSize: 12, color: "#8C6A2A", marginBottom: 10 }}>
          {calibratePlotId ? `Calibrating plot #${calibratePlotId} — click anywhere on the map to move it there.` : "Pick a plot number below, or click a dimmed marker on the map to select it."}
        </div>
      )}

      <div ref={stageRef} onClick={handleStageClick} style={{ position: "relative", borderRadius: 10, overflow: "hidden", border: calibrateMode ? "2px solid #C9932A" : "1px solid #DCE6D8", background: "#000", aspectRatio: "1600 / 899", cursor: calibrateMode && calibratePlotId ? "crosshair" : "default" }}>
        <div style={{ position: "absolute", inset: 0, transform: `scale(${zoom})`, transformOrigin: `${focus.x}% ${focus.y}%`, transition: "transform 0.3s ease" }}>
        <img src={MASTERPLAN_IMG} alt="Thakher masterplan" style={{ display: "block", width: "100%", height: "100%", objectFit: "cover" }} />

        {plots.map((p) => {
          const meta = MAP_STATUS_META[p.status];
          const isExisting = p.status === "Existing";
          const isDimmed = statusFilter !== "All" && p.status !== statusFilter;
          const isCalibrating = calibrateMode && calibratePlotId === p.id;
          const size = isExisting ? 13 : 22;
          const isHovered = hovered === p.id;
          const isSelected = selected === p.id;
          return (
            <div
              key={p.id}
              className="mp-marker"
              onMouseEnter={() => setHovered(p.id)}
              onMouseLeave={() => setHovered(null)}
              onClick={(e) => {
                if (calibrateMode) { e.stopPropagation(); setCalibratePlotId(p.id); return; }
                setSelected(p.id); focusOn(p);
              }}
              style={{
                position: "absolute", left: `${p.x}%`, top: `${p.y}%`, transform: `translate(-50%, -50%) scale(${1 / zoom})`, transformOrigin: "center",
                width: isCalibrating ? size + 8 : size, height: isCalibrating ? size + 8 : size, borderRadius: "50%",
                background: isExisting ? `${meta.color}CC` : meta.color,
                opacity: calibrateMode && !isCalibrating ? 0.35 : isDimmed ? 0.18 : 1,
                border: isCalibrating ? "3px solid #C9932A" : isSelected ? "2px solid #1E2E1B" : "1.5px solid rgba(255,255,255,0.85)",
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: isExisting ? 0 : 9, fontWeight: 700, color: "#FFFFFF",
                boxShadow: isHovered || isSelected || isCalibrating ? "0 0 0 4px rgba(255,255,255,0.35)" : "0 1px 3px rgba(0,0,0,0.4)",
                zIndex: isCalibrating ? 90 : isHovered || isSelected ? 40 : isExisting ? 10 : 20,
              }}
              title={`Plot ${p.id} — ${meta.label}`}
            >
              {!isExisting && p.id}
            </div>
          );
        })}
        </div>

        <div style={{ position: "absolute", top: 10, right: 10, zIndex: 70, display: "flex", flexDirection: "column", gap: 4, background: "rgba(255,255,255,0.9)", borderRadius: 8, padding: 4 }}>
          <div className="tk-icon-btn" onClick={zoomIn} style={{ width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, fontWeight: 700, color: "#1E2E1B", opacity: 1 }}>+</div>
          <div className="tk-icon-btn" onClick={zoomOut} style={{ width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, fontWeight: 700, color: "#1E2E1B", opacity: 1 }}>&minus;</div>
          <div className="tk-icon-btn" onClick={resetView} style={{ width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, color: "#1E2E1B", opacity: 1 }}>RST</div>
        </div>

        {selectedPlot && !calibrateMode && (
          <div style={{ position: "absolute", left: `${Math.min(Math.max(selectedPlot.x, 14), 78)}%`, top: `${selectedPlot.y > 55 ? selectedPlot.y - 8 : selectedPlot.y + 8}%`, transform: `translate(-50%, ${selectedPlot.y > 55 ? "-100%" : "0"})`, background: "#FFFFFF", borderRadius: 10, border: "1px solid #DCE6D8", boxShadow: "0 8px 24px rgba(0,0,0,0.25)", padding: "12px 14px", minWidth: 210, zIndex: 80 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
              <div style={{ fontFamily: "'Cairo', sans-serif", fontWeight: 700, fontSize: 15 }}>Plot {selectedPlot.id}</div>
              <X size={14} color="#8CA184" style={{ cursor: "pointer" }} onClick={() => setSelected(null)} />
            </div>
            {editMode ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 6 }}>
                <select value={selectedPlot.status} onChange={(e) => onUpdatePlot(selectedPlot.id, "status", e.target.value)} style={{ ...cellSelectStyle, width: "100%", textAlign: "left" }}>
                  {STATUS_OPTIONS.map((s) => <option key={s}>{s}</option>)}
                </select>
                <select value={selectedPlot.platform || "Lower"} onChange={(e) => onUpdatePlot(selectedPlot.id, "platform", e.target.value)} style={{ ...cellSelectStyle, width: "100%", textAlign: "left" }}>
                  <option>Lower</option>
                  <option>Upper</option>
                </select>
                <input
                  value={selectedPlot.buyer || ""}
                  onChange={(e) => onUpdatePlot(selectedPlot.id, "buyer", e.target.value)}
                  placeholder="Buyer / lead name"
                  style={{ ...cellInputStyle, width: "100%" }}
                />
                <input
                  value={selectedPlot.notes || ""}
                  onChange={(e) => onUpdatePlot(selectedPlot.id, "notes", e.target.value)}
                  placeholder="Notes"
                  style={{ ...cellInputStyle, width: "100%" }}
                />
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: MAP_STATUS_META[selectedPlot.status].color }} />
                <span style={{ fontSize: 12.5, fontWeight: 500 }}>{MAP_STATUS_META[selectedPlot.status].label}</span>
              </div>
            )}
            <div style={{ fontSize: 11.5, color: "#5F7159" }}>{selectedPlot.platform || "Lower"} Platform</div>
            {!editMode && selectedPlot.buyer && <div style={{ fontSize: 11.5, color: "#5F7159", marginTop: 3 }}>Buyer: {selectedPlot.buyer}</div>}
            {!editMode && selectedPlot.notes && <div style={{ fontSize: 11.5, color: "#5F7159", marginTop: 3 }}>Notes: {selectedPlot.notes}</div>}
            {selectedPlot.updatedBy && (
              <div style={{ fontSize: 10.5, color: "#8CA184", marginTop: 4 }}>Last updated by {selectedPlot.updatedBy} &middot; {timeAgo(selectedPlot.updatedAt)}</div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function timeAgo(ts) {
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.floor(diff / 60000);
  if (min < 1) return "just now";
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  return `${day}d ago`;
}

    try {
      const results = await Promise.allSettled([
        Storage.get("thakher-plots", shared),
        Storage.get("thakher-units", shared),
        Storage.get("thakher-workitems", shared),
        Storage.get("thakher-changelog", shared),
        Storage.get("thakher-projects", shared),
        Storage.get("thakher-brokers", shared),
        Storage.get("thakher-pin", shared),
        Storage.get("thakher-webhook", shared),
        Storage.get("thakher-units-monthly-targets", shared),
        Storage.get("thakher-lands-monthly-targets", shared),
        Storage.get("thakher-leads", shared),
        Storage.get("thakher-sales-activity", shared),
      ]);
      const [pRes, uRes, wRes, cRes, prRes, bRes, pinRes, whRes, utRes, ltRes, leadRes, actRes] = results;
      if (pRes.status === "fulfilled" && pRes.value) setPlots(JSON.parse(pRes.value.value));
      if (uRes.status === "fulfilled" && uRes.value) setUnits(JSON.parse(uRes.value.value));
      if (wRes.status === "fulfilled" && wRes.value) setWorkItems(JSON.parse(wRes.value.value));
      if (cRes.status === "fulfilled" && cRes.value) setChangelog(JSON.parse(cRes.value.value));
      if (prRes.status === "fulfilled" && prRes.value) setProjects(JSON.parse(prRes.value.value));
      if (bRes.status === "fulfilled" && bRes.value) setBrokers(JSON.parse(bRes.value.value));
      if (pinRes.status === "fulfilled" && pinRes.value) setPin(pinRes.value.value);
      if (whRes.status === "fulfilled" && whRes.value) setWebhookUrl(whRes.value.value);
      if (utRes.status === "fulfilled" && utRes.value) setUnitsMonthlyTargets(JSON.parse(utRes.value.value));
      if (ltRes.status === "fulfilled" && ltRes.value) setLandsMonthlyTargets(JSON.parse(ltRes.value.value));
      if (leadRes.status === "fulfilled" && leadRes.value) setLeads(JSON.parse(leadRes.value.value));
      if (actRes.status === "fulfilled" && actRes.value) setSalesActivity(JSON.parse(actRes.value.value));
    } catch (e) {
      // keep current state
    }
  };

  // Switch between team-shared and this-device-only storage. Snapshots current
  // in-memory data into the new scope so nothing is lost on first switch.
  const switchDataScope = async (newScope) => {
    const shared = newScope !== "private";
    try {
      await Promise.allSettled([
        Storage.set("thakher-plots", JSON.stringify(plots), shared),
        Storage.set("thakher-units", JSON.stringify(units), shared),
        Storage.set("thakher-workitems", JSON.stringify(workItems), shared),
        Storage.set("thakher-changelog", JSON.stringify(changelog), shared),
        Storage.set("thakher-projects", JSON.stringify(projects), shared),
        Storage.set("thakher-brokers", JSON.stringify(brokers), shared),
        Storage.set("thakher-units-monthly-targets", JSON.stringify(unitsMonthlyTargets), shared),
        Storage.set("thakher-lands-monthly-targets", JSON.stringify(landsMonthlyTargets), shared),
        Storage.set("thakher-leads", JSON.stringify(leads), shared),
        Storage.set("thakher-sales-activity", JSON.stringify(salesActivity), shared),
      ]);
    } catch (e) {
      // best effort
    }
    setDataScope(newScope);
    Storage.set("thakher-data-scope", newScope, false).catch(() => {});
  };

  useEffect(() => {
    let mounted = true;
    (async () => {
      let scope = "shared";
      try {
        const scopeRes = await Storage.get("thakher-data-scope", false);
        if (scopeRes) scope = scopeRes.value;
      } catch (e) {
        // default to shared
      }
      if (mounted) setDataScope(scope);
      await loadShared(scope);
      try {
        const nameRes = await Storage.get("thakher-username", false);
        if (mounted && nameRes) setUserName(nameRes.value);
      } catch (e) {
        // no name saved yet
      }
      if (mounted) setLoaded(true);
    })();
    return () => { mounted = false; };
  }, []);

  // Live refresh while presenting, so a meeting screen reflects edits made elsewhere
  useEffect(() => {
    if (!presentMode) return;
    const interval = setInterval(() => loadShared(dataScope), 12000);
    return () => clearInterval(interval);
  }, [presentMode]);

  useEffect(() => { if (loaded) Storage.set("thakher-plots", JSON.stringify(plots), dataShared).catch(() => {}); }, [plots, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-units", JSON.stringify(units), dataShared).catch(() => {}); }, [units, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-workitems", JSON.stringify(workItems), dataShared).catch(() => {}); }, [workItems, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-changelog", JSON.stringify(changelog), dataShared).catch(() => {}); }, [changelog, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-projects", JSON.stringify(projects), dataShared).catch(() => {}); }, [projects, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-brokers", JSON.stringify(brokers), dataShared).catch(() => {}); }, [brokers, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-pin", pin, dataShared).catch(() => {}); }, [pin, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-webhook", webhookUrl, dataShared).catch(() => {}); }, [webhookUrl, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-units-monthly-targets", JSON.stringify(unitsMonthlyTargets), dataShared).catch(() => {}); }, [unitsMonthlyTargets, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-lands-monthly-targets", JSON.stringify(landsMonthlyTargets), dataShared).catch(() => {}); }, [landsMonthlyTargets, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-leads", JSON.stringify(leads), dataShared).catch(() => {}); }, [leads, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-sales-activity", JSON.stringify(salesActivity), dataShared).catch(() => {}); }, [salesActivity, loaded]);
  useEffect(() => { if (loaded) Storage.set("thakher-username", userName, false).catch(() => {}); }, [userName, loaded]);

  // Append-only activity log — never trims or overwrites past entries
  const logChange = (message, undo) => {
    const entry = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, ts: Date.now(), user: userName.trim() || "Unnamed", message, undo: undo || null };
    setChangelog((prev) => [entry, ...prev]);
  };

  const undoChange = (entry) => {
    if (!entry || !entry.undo) return;
    const u = entry.undo;
    if (u.action === "update" && u.entity === "unit") setUnits((prev) => prev.map((x) => (x.id === u.id ? { ...x, [u.field]: u.oldValue } : x)));
    if (u.action === "update" && u.entity === "plot") setPlots((prev) => prev.map((x) => (x.id === u.id ? { ...x, [u.field]: u.oldValue } : x)));
    if (u.action === "update" && u.entity === "workitem") setWorkItems((prev) => prev.map((x) => (x.id === u.id ? { ...x, [u.field]: u.oldValue } : x)));
    if (u.action === "update" && u.entity === "lead") setLeads((prev) => prev.map((x) => (x.id === u.id ? { ...x, [u.field]: u.oldValue } : x)));
    if (u.action === "update" && u.entity === "activity") setSalesActivity((prev) => prev.map((x) => (x.id === u.id ? { ...x, [u.field]: u.oldValue } : x)));
    if (u.action === "delete" && u.entity === "unit") setUnits((prev) => [...prev, u.object]);
    if (u.action === "delete" && u.entity === "workitem") setWorkItems((prev) => [...prev, u.object]);
    if (u.action === "delete" && u.entity === "lead") setLeads((prev) => [...prev, u.object]);
    if (u.action === "delete" && u.entity === "activity") setSalesActivity((prev) => [...prev, u.object]);
    setChangelog((prev) => prev.map((c) => (c.id === entry.id ? { ...c, undo: null, undone: true } : c)));
    logChange(`Undid: ${entry.message}`);
  };

  const goTo = (sectionId, targetView) => {
    if (targetView) setView(targetView);
    setTimeout(() => {
      document.getElementById(sectionId)?.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 60);
  };

  const requirePin = (action) => {
    if (!pin || pinUnlocked) { action(); return; }
    const entered = window.prompt("Enter the edit access PIN:");
    if (entered === pin) { setPinUnlocked(true); action(); }
    else if (entered !== null) window.alert("Incorrect PIN.");
  };

  const clearFilters = () => { setStatusFilter("All"); setProjectFilter("All"); setSearch(""); };

  const lands = useMemo(() => plots.filter((p) => p.status !== "Existing"), [plots]);
  const totalLands = lands.length;
  const soldLands = lands.filter((l) => l.status === "Sold").length;
  const availableLands = lands.filter((l) => l.status === "Available").length;

  const totalUnits = units.length;
  const soldUnits = units.filter((u) => u.status === "Sold").length;
  const remainingUnits = totalUnits - soldUnits;
  const availableUnitsCount = units.filter((u) => u.status === "Available").length;
  // Flip to true once the new masterplan image has been swapped in.
  const plotsAreNewMasterplan = false;
  const reservedUnitsCount = units.filter((u) => u.status === "Reserved").length;
  const totalRevenue = units.filter((u) => u.status === "Sold").reduce((s, u) => s + u.totalPrice, 0);
  const totalCollected = units.filter((u) => u.status === "Sold").reduce((s, u) => s + (Number(u.amountCollected) || 0), 0);
  const totalPortfolioValue = units.reduce((s, u) => s + (Number(u.totalPrice) || 0), 0);
  const handedOverUnits = units.filter((u) => u.handedOver);
  const handedOverCount = handedOverUnits.length;
  const handedOverCollected = handedOverUnits.reduce((s, u) => s + (Number(u.amountCollected) || 0), 0);
  const remainingHandoverCount = soldUnits - handedOverCount;

  const projectStats = useMemo(() => {
    return projects.map((p) => {
      const pUnits = units.filter((u) => u.projectId === p.id);
      const sold = pUnits.filter((u) => u.status === "Sold").length;
      const available = pUnits.filter((u) => u.status === "Available").length;
      const soldUnits2 = pUnits.filter((u) => u.status === "Sold");
      const revenue = soldUnits2.reduce((s, u) => s + u.totalPrice, 0);
      const collected = soldUnits2.reduce((s, u) => s + (Number(u.amountCollected) || 0), 0);
      const totalValue = pUnits.reduce((s, u) => s + (Number(u.totalPrice) || 0), 0);
      const handedOver = soldUnits2.filter((u) => u.handedOver).length;
      const handedOverCollected = soldUnits2.filter((u) => u.handedOver).reduce((s, u) => s + (Number(u.amountCollected) || 0), 0);
      const remainingHandover = sold - handedOver;
      return { ...p, total: pUnits.length, sold, available, revenue, collected, totalValue, handedOver, handedOverCollected, remainingHandover };
    });
  }, [projects, units]);

  const landsRevenue = lands.filter((l) => l.status === "Sold").reduce((s, l) => s + (Number(l.price) || 0), 0);
  const landsCollected = lands.filter((l) => l.status === "Sold").reduce((s, l) => s + (Number(l.amountCollected) || 0), 0);
  const landsTotalValue = lands.reduce((s, l) => s + (Number(l.price) || 0), 0);
  const availableUnitsValue = units.filter((u) => u.status === "Available").reduce((s, u) => s + (Number(u.totalPrice) || 0), 0);
  const availableLandsValue = lands.filter((l) => l.status === "Available").reduce((s, l) => s + (Number(l.price) || 0), 0);

  // Combined portfolio: units + land plots together
  const combinedTotalValue = totalPortfolioValue + landsTotalValue;
  const combinedSoldValue = totalRevenue + landsRevenue;
  const combinedCollectedValue = totalCollected + landsCollected;

  // Lower Platform specifically (as opposed to any future Upper Platform plots)
  const lowerLands = lands.filter((l) => (l.platform || "Lower") === "Lower");
  const lowerLandsTotalValue = lowerLands.reduce((s, l) => s + (Number(l.price) || 0), 0);
  const lowerLandsSoldValue = lowerLands.filter((l) => l.status === "Sold").reduce((s, l) => s + (Number(l.price) || 0), 0);
  const lowerLandsCollected = lowerLands.filter((l) => l.status === "Sold").reduce((s, l) => s + (Number(l.amountCollected) || 0), 0);

  // Build the last 12 real calendar months, then count actual sales by real saleDate.
  // Falls back to an even estimate only if nothing has a saleDate yet.
  const last12Months = useMemo(() => {
    const arr = [];
    const now = new Date();
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      arr.push({ label: d.toLocaleString("en", { month: "short" }), year: d.getFullYear(), monthIdx: d.getMonth() });
    }
    return arr;
  }, []);

  const buildRealMonthly = (items, dateField, priceField, totalCount, monthlyTargets, avgPrice) => {
    const anyDated = items.some((it) => it[dateField]);
    let cumTargetCount = 0;
    let cumTargetValue = 0;
    return last12Months.map((m, idx) => {
      const mt = monthlyTargets[m.label] || { count: 0, value: 0 };
      cumTargetCount += mt.count;
      const monthValue = mt.value || mt.count * avgPrice;
      cumTargetValue += monthValue;
      const targetPct = totalCount ? Math.round((cumTargetCount / totalCount) * 1000) / 10 : 0;
      let sold, revenue;
      if (!anyDated) {
        const MONTH_FRACTIONS = [0.05, 0.11, 0.18, 0.26, 0.34, 0.43, 0.51, 0.60, 0.68, 0.77, 0.87, 1.0];
        const soldNow = items.filter((it) => it.status === "Sold").length;
        sold = Math.round(soldNow * MONTH_FRACTIONS[idx]);
        revenue = 0;
      } else {
        const cutoff = new Date(m.year, m.monthIdx + 1, 1);
        const monthStart = new Date(m.year, m.monthIdx, 1);
        sold = items.filter((it) => it[dateField] && new Date(it[dateField]) < cutoff).length;
        revenue = items
          .filter((it) => it[dateField] && new Date(it[dateField]) >= monthStart && new Date(it[dateField]) < cutoff)
          .reduce((s, it) => s + (Number(it[priceField]) || 0), 0);
      }
      return {
        month: m.label, year: m.year, monthIdx: m.monthIdx,
        pct: totalCount ? Math.round((sold / totalCount) * 1000) / 10 : 0, sold, total: totalCount, revenue, targetPct,
        targetMonthCount: mt.count, targetMonthValue: monthValue, targetCumCount: cumTargetCount, targetCumValue: cumTargetValue,
      };
    });
  };

  const avgUnitPrice = units.length ? units.reduce((s, u) => s + (Number(u.totalPrice) || 0), 0) / units.length : 0;
  const pricedLands = lands.filter((l) => Number(l.price) > 0);
  const avgLandPrice = pricedLands.length ? pricedLands.reduce((s, l) => s + Number(l.price), 0) / pricedLands.length : 0;

  const unitsTargetAnnual = MONTH_KEYS.reduce((s, m) => s + ((unitsMonthlyTargets[m] && unitsMonthlyTargets[m].count) || 0), 0);
  const landsTargetAnnual = MONTH_KEYS.reduce((s, m) => s + ((landsMonthlyTargets[m] && landsMonthlyTargets[m].count) || 0), 0);

  const landsMonthly = buildRealMonthly(lands, "saleDate", "price", totalLands, landsMonthlyTargets, avgLandPrice);
  const unitsMonthly = buildRealMonthly(units, "saleDate", "totalPrice", totalUnits, unitsMonthlyTargets, avgUnitPrice);

  const unitsAchievementPct = unitsTargetAnnual ? Math.round((soldUnits / unitsTargetAnnual) * 100) : null;
  const landsAchievementPct = landsTargetAnnual ? Math.round((soldLands / landsTargetAnnual) * 100) : null;

  const unitMonthSold = useMemo(() => {
    if (!unitMonthDetail) return [];
    const monthStart = new Date(unitMonthDetail.year, unitMonthDetail.monthIdx, 1);
    const monthEnd = new Date(unitMonthDetail.year, unitMonthDetail.monthIdx + 1, 1);
    return units.filter((u) => u.saleDate && new Date(u.saleDate) >= monthStart && new Date(u.saleDate) < monthEnd);
  }, [unitMonthDetail, units]);
  const unitsRemainingList = useMemo(() => units.filter((u) => u.status !== "Sold"), [units]);

  const unitMonthDetailPanel = unitMonthDetail && (
    <div style={{ background: "#FFFFFF", border: "1px solid #DCE6D8", borderRadius: 10, padding: "16px 18px", marginBottom: 24 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontFamily: "'Cairo', sans-serif", fontWeight: 700, fontSize: 14 }}>
          {unitMonthDetail.label} {unitMonthDetail.year} — {t("soldThisMonth")} ({unitMonthSold.length}) &middot; {t("remainingNow")} ({unitsRemainingList.length})
        </span>
        <X size={14} className="tk-icon-btn" onClick={() => setUnitMonthDetail(null)} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <div>
          <div style={{ fontSize: 11, color: "#8CA184", textTransform: "uppercase", marginBottom: 6, fontWeight: 600 }}>{t("soldThisMonth")}</div>
          {unitMonthSold.length === 0 ? (
            <div style={{ fontSize: 12.5, color: "#8CA184" }}>{t("noSalesThisMonth")}</div>
          ) : (
            <div style={{ maxHeight: 220, overflowY: "auto" }}>
              {unitMonthSold.map((u) => (
                <div key={u.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #E3ECDF", fontSize: 12.5 }}>
                  <span>{u.unitNo} — {(projects.find((p) => p.id === u.projectId) || {}).name || ""}</span>
                  <span style={{ fontWeight: 600 }}>{sar(u.totalPrice)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
        <div>
          <div style={{ fontSize: 11, color: "#8CA184", textTransform: "uppercase", marginBottom: 6, fontWeight: 600 }}>{t("remainingNow")}</div>
          <div style={{ maxHeight: 220, overflowY: "auto" }}>
            {unitsRemainingList.map((u) => (
              <div key={u.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: "1px solid #E3ECDF", fontSize: 12.5 }}>
                <span>{u.unitNo} — {(projects.find((p) => p.id === u.projectId) || {}).name || ""}</span>
                <Badge status={u.status} colorMap={STATUS_COLORS} />
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );

  const updatePlot = (id, field, value) => {
    const before = plots.find((p) => p.id === id);
    const oldValue = before ? before[field] : undefined;
    const stamp = { updatedAt: Date.now(), updatedBy: userName.trim() || "Unnamed" };
    setPlots((prev) => prev.map((p) => {
      if (p.id !== id) return p;
      const next = { ...p, [field]: value, ...stamp };
      if (field === "status" && value === "Sold" && !p.saleDate) next.saleDate = dateOffset(0);
      if (field === "area" || field === "pricePerSqm") {
        const area = field === "area" ? Number(value) : Number(p.area) || 0;
        const pricePerSqm = field === "pricePerSqm" ? Number(value) : Number(p.pricePerSqm) || 0;
        if (area && pricePerSqm) next.price = area * pricePerSqm;
      }
      return next;
    }));
    logChange(
      field === "status" ? `Changed plot #${id} status to "${value}"` : `Updated plot #${id} — ${field} set to "${value}"`,
      { action: "update", entity: "plot", id, field, oldValue }
    );
  };

  const repositionPlot = (id, x, y) => {
    const stamp = { updatedAt: Date.now(), updatedBy: userName.trim() || "Unnamed" };
    setPlots((prev) => prev.map((p) => (p.id === id ? { ...p, x, y, ...stamp } : p)));
    logChange(`Repositioned plot #${id} on the map`);
  };

  const bulkImportLands = (rows) => {
    const stamp = { updatedAt: Date.now(), updatedBy: userName.trim() || "Unnamed" };
    let matched = 0;
    setPlots((prev) => prev.map((p) => {
      const row = rows.find((r) => Number(r.plotId) === p.id);
      if (!row) return p;
      matched++;
      const next = { ...p, ...stamp };
      if (row.status && STATUS_OPTIONS.includes(row.status)) next.status = row.status;
      if (row.area) next.area = Number(row.area);
      if (row.pricePerSqm) next.pricePerSqm = Number(row.pricePerSqm);
      if (row.price) next.price = Number(row.price);
      else if (next.area && next.pricePerSqm) next.price = Number(next.area) * Number(next.pricePerSqm);
      if (row.amountCollected) next.amountCollected = Number(row.amountCollected);
      if (row.buyer) next.buyer = row.buyer;
      if (row.notes) next.notes = row.notes;
      if (row.saleDate) next.saleDate = row.saleDate;
      if (row.platform && PLATFORM_OPTIONS.includes(row.platform)) next.platform = row.platform;
      return next;
    }));
    logChange(`Imported updates for ${matched} land plot(s) from file`);
    return matched;
  };

  const updateUnit = (id, field, value) => {
    const unit = units.find((u) => u.id === id);
    const oldValue = unit ? unit[field] : undefined;
    setUnits((prev) => prev.map((u) => {
      if (u.id !== id) return u;
      const next = { ...u, [field]: value, updatedAt: Date.now(), updatedBy: userName.trim() || "Unnamed" };
      if (field === "area" || field === "pricePerSqm") {
        const area = field === "area" ? Number(value) : u.area;
        const pricePerSqm = field === "pricePerSqm" ? Number(value) : u.pricePerSqm;
        next.totalPrice = area * pricePerSqm;
      }
      if (field === "status" && value === "Sold" && !u.saleDate) next.saleDate = dateOffset(0);
      return next;
    }));
    if (unit) logChange(`Updated unit ${unit.unitNo} — ${field} set to "${value}"`, { action: "update", entity: "unit", id, field, oldValue });
  };
  const addUnit = (defaultProjectId) => {
    const nextId = Math.max(0, ...units.map((u) => u.id)) + 1;
    const unitNo = `U-NEW-${nextId}`;
    const projectId = defaultProjectId || (projects[0] && projects[0].id) || "";
    setUnits((prev) => [...prev, { id: nextId, projectId, unitNo, area: 100, pricePerSqm: 5000, totalPrice: 500000, status: "Available", broker: "", notes: "", handedOver: false, updatedAt: Date.now(), updatedBy: userName.trim() || "Unnamed" }]);
    logChange(`Added new unit ${unitNo}`);
  };
  const bulkImportUnits = (rows) => {
    let nextId = Math.max(0, ...units.map((u) => u.id)) + 1;
    const projectByName = (name) => {
      const found = projects.find((p) => p.name.toLowerCase() === String(name || "").toLowerCase());
      return found ? found.id : (projects[0] && projects[0].id) || "";
    };
    const newUnits = rows.map((r) => {
      const area = Number(r.area) || 100;
      const pricePerSqm = Number(r.pricePerSqm) || 5000;
      const status = ["Available", "Reserved", "Sold"].includes(r.status) ? r.status : "Available";
      return {
        id: nextId++,
        projectId: r.projectId || projectByName(r.project),
        unitNo: r.unitNo || `U-IMP-${nextId}`,
        area,
        pricePerSqm,
        totalPrice: Number(r.totalPrice) || area * pricePerSqm,
        status,
        broker: brokers.includes(r.broker) ? r.broker : "",
        notes: r.notes || "",
        saleDate: status === "Sold" ? (r.saleDate || dateOffset(0)) : null,
        updatedAt: Date.now(),
        updatedBy: userName.trim() || "Unnamed",
      };
    });
    setUnits((prev) => [...prev, ...newUnits]);
    logChange(`Imported ${newUnits.length} unit(s) from file`);
    return newUnits.length;
  };
  const deleteUnit = (id) => {
    const unit = units.find((u) => u.id === id);
    setUnits((prev) => prev.filter((u) => u.id !== id));
    if (unit) logChange(`Deleted unit ${unit.unitNo}`, { action: "delete", entity: "unit", object: unit });
  };

  const updateWorkItem = (id, field, value) => {
    const before = workItems.find((w) => w.id === id);
    const oldValue = before ? before[field] : undefined;
    setWorkItems((prev) => prev.map((w) => (w.id === id ? { ...w, [field]: value, updatedAt: Date.now(), updatedBy: userName.trim() || "Unnamed" } : w)));
    logChange(`Updated work item "${before?.item || id}" — ${field} set to "${value}"`, { action: "update", entity: "workitem", id, field, oldValue });
  };
  const addWorkItem = () => {
    const nextId = Math.max(0, ...workItems.map((w) => w.id)) + 1;
    setWorkItems((prev) => [...prev, { id: nextId, item: "New work item", businessUnit: "Projects", assignedTo: brokers[0], lastUpdate: dateOffset(0), expected: dateOffset(30), status: "On track", updatedAt: Date.now(), updatedBy: userName.trim() || "Unnamed" }]);

  const deleteWorkItem = (id) => {

    setWorkItems((prev) => prev.filter((x) => x.id !== id));

  const updateLead = (id, field, value) => {
    const before = leads.find((l) => l.id === id);
    const oldValue = before ? before[field] : undefined;
    setLeads((prev) => prev.map((l) => (l.id === id ? { ...l, [field]: value, updatedAt: dateOffset(0) } : l)));
    logChange(`Updated lead "${before?.clientName || id}" — ${field} set to "${value}"`, { action: "update", entity: "lead", id, field, oldValue });
  };
  const addLead = () => {
    const nextId = Math.max(0, ...leads.map((l) => l.id)) + 1;
    setLeads((prev) => [...prev, { id: nextId, clientName: "New lead", phone: "", projectId: (projects[0] && projects[0].id) || "", stage: "Potential", value: 0, broker: brokers[0] || "", notes: "", updatedAt: dateOffset(0) }]);
    logChange("Added new lead to pipeline");
  };
  const deleteLead = (id) => {
    const l = leads.find((x) => x.id === id);
    setLeads((prev) => prev.filter((x) => x.id !== id));

  const updateActivity = (id, field, value) => {

    logChange(`Updated sales activity for "${before?.broker || id}" — ${field} set to "${value}"`, { action: "update", entity: "activity", id, field, oldValue });

  const addActivity = () => {
    const nextId = Math.max(0, ...salesActivity.map((a) => a.id)) + 1;

  const deleteActivity = (id) => {
    const a = salesActivity.find((x) => x.id === id);
    setSalesActivity((prev) => prev.filter((x) => x.id !== id));

  const addProject = (name) => {
    const id = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-") || `project-${Date.now()}`;

  const deleteProject = (id) => {

      const matchesStatus = statusFilter === "All" || u.status === statusFilter;
      const matchesProject = projectFilter === "All" || u.projectId === projectFilter;
      return matchesSearch && matchesStatus && matchesProject;
    });

  const filteredLands = useMemo(() => {

  const totalActions = workItems.length;

  const delayedCount = workItems.filter((w) => w.status === "Delayed").length;

      ["Land Plots", String(landLeads.length), sarCompact(landLeads.reduce((s, l) => s + (Number(l.value) || 0), 0))],
    ], { ...tblOpts, y: 1.0, colW: [3.5, 2.85, 2.85] });

    // Slide 6 — CEO Action Items

    slide.addText(`${totalActions} total  ·  ${completedPct}% completed  ·  ${delayedCount} delayed  ·  ${atRiskItems.length} at risk`, { x: 0.4, y: 0.9, w: 9.2, h: 0.4, fontSize: 13, bold: true, color: MUTE, fontFace: "Arial" });
    const overdueRows = topOverdue.slice(0, 8).map((w) => [w.item, w.assignedTo, `${w.overdue}d`]);
    if (overdueRows.length) {
      slide.addText("Top Overdue Items", { x: 0.4, y: 1.4, w: 9.2, h: 0.3, fontSize: 13, bold: true, color: INK, fontFace: "Arial" });
      slide.addTable([headRow(["Item", "Assigned to", "Overdue"]), ...overdueRows], { ...tblOpts, y: 1.75, colW: [5.5, 2.5, 1.2] });
    } else {
      slide.addText("Nothing overdue right now.", { x: 0.4, y: 1.5, w: 9.2, h: 0.4, fontSize: 12, color: MUTE, fontFace: "Arial" });
    }

    pptx.writeFile({ fileName: `Thakher-Executive-Overview-${new Date().toISOString().slice(0, 10)}.pptx` });
  };

  return (

                    <td style={{ padding: "8px 12px", textAlign: "right" }}>
                      {editMode ? (
                        <select value={l.status} onChange={(e) => updatePlot(l.id, "status", e.target.value)} style={cellSelectStyle}>
                          {STATUS_OPTIONS.map((s) => <option key={s}>{s}</option>)}
                        </select>
                      ) : (
                        <Badge status={l.status} colorMap={STATUS_COLORS} />
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding: "8px 14px", fontSize: 11, color: "#8CA184", borderTop: "1px solid #E3ECDF" }}>Real plots from Thakher's published masterplan. <span className="tk-edit-btn" style={{ color: "#2A4C25", fontWeight: 700, textDecoration: "underline" }} onClick={() => setView("masterplan")}>Open the interactive map ›</span></div>
        </div>
      </div>
      </React.Fragment>
      )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ThakherSalesDashboard />);
</script>
</body>
</html>
